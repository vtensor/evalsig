[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalsig"
version = "0.1.2"
description = "Statistical inference for LLM evaluations: paired tests, clustered SE, MDE, sequential testing, release gating."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Vikram Dev", email = "hello@evalsig.dev"},
]
keywords = [
    "llm", "evaluation", "statistics", "release-gate",
    "paired-test", "bootstrap", "mde", "power-analysis",
    "sequential-testing", "multiple-comparisons",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.4",
]
braintrust = [
    "braintrust>=0.0.1",
]
all = [
    "evalsig[dev,docs,braintrust]",
]

[project.urls]
Homepage = "https://evalsig.dev"
Documentation = "https://evalsig.dev"
Repository = "https://github.com/vtensor/evalsig"
Issues = "https://github.com/vtensor/evalsig/issues"
Changelog = "https://evalsig.dev/changelog/"

[project.scripts]
evalsig = "evalsig.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"
