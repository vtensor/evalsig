name: Publish

# Manual only. Fires only when a maintainer clicks "Run workflow" in
# the Actions tab and provides the tag they want to publish. We do NOT
# auto-trigger on tag pushes — accidental tags should not ship to PyPI.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). Must already exist and match pyproject version."
        required: true

permissions:
  contents: read
  id-token: write   # required for PyPI Trusted Publishing

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Check tag matches pyproject version
        run: |
          TAG="${{ inputs.tag }}"
          TAG_VERSION="${TAG#v}"
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag: $TAG_VERSION"
          echo "pyproject: $PYPROJECT_VERSION"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::tag $TAG_VERSION does not match pyproject version $PYPROJECT_VERSION"
            exit 1
          fi

      - name: Build
        run: python -m build

      - name: Twine metadata check
        run: twine check dist/*

      - name: Smoke test installed wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/evalsig --version
          /tmp/smoke/bin/evalsig mde --sd-diff 0.3 --n-pairs 1000 --one-sided

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/evalsig
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  verify:
    name: verify install from PyPI
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for PyPI index, then install
        run: |
          python -m pip install --upgrade pip
          for i in 1 2 3 4 5; do
            if pip install --no-cache-dir evalsig; then break; fi
            echo "PyPI index not ready yet, retrying in 20s ($i/5)"
            sleep 20
          done
          evalsig --version
          evalsig mde --sd-diff 0.3 --n-pairs 1000 --one-sided
