name: Bug report
description: Something does not work the way the docs say.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Small reproducers travel a long way: a 20-line
        script plus the input file beats a 200-line description.

  - type: input
    id: version
    attributes:
      label: evalsig version
      description: Output of `evalsig --version`.
      placeholder: "evalsig 0.1.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version`.
      placeholder: "Python 3.11.7"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: A minimal script or CLI command that triggers the bug.
      render: bash
      placeholder: |
        evalsig gate --baseline a.json --candidate b.json --min-delta 0.005
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Paste the error message or unexpected output.
      render: text
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Stack traces, screenshots, environment quirks.
