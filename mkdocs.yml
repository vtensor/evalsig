site_name: EvalSig
site_description: Statistical rigor for frontier AI evaluation. Paired tests, clustered SE, MDE and power.
site_url: https://www.melonai.in/docs/evalsig/
site_author: Vikram Dev

repo_name: vtensor/evalsig
repo_url: https://github.com/vtensor/evalsig
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 Vikram Dev

use_directory_urls: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Get started:
      - Installation: get-started/installation.md
      - Quickstart: get-started/quickstart.md
      - First comparison: get-started/first-comparison.md
      - Understanding output: get-started/understanding-output.md
  - Concepts:
      - What EvalSig solves: concepts/what-evalsig-solves.md
      - Paired vs unpaired: concepts/paired-vs-unpaired.md
      - Clustering: concepts/clustering.md
      - MDE and power: concepts/mde-and-power.md
      - Effect sizes: concepts/effect-sizes.md
      - Multiplicity: concepts/multiplicity.md
      - Sequential testing: concepts/sequential-testing.md
      - Glossary: concepts/glossary.md
  - Usage:
      - CLI: usage/cli.md
      - Configuration: usage/configuration.md
      - Python API: usage/python-api.md
      - Output formats: usage/output-formats.md
      - Integrations: usage/integrations.md
  - Modules:
      - types: modules/types.md
      - exceptions: modules/exceptions.md
      - io: modules/io.md
      - inference: modules/inference.md
      - compare: modules/compare.md
      - store: modules/store.md
      - integrations: modules/integrations.md
      - cli: modules/cli.md
  - Scenarios:
      - CI release gate: scenarios/ci-release-gate.md
      - Multi-task gates: scenarios/multi-task-gates.md
      - Sequential watch: scenarios/sequential-watch.md
      - A/B on RLHF checkpoints: scenarios/ab-on-rlhf-checkpoints.md
      - Flakiness detection: scenarios/flakiness-detection.md
      - Compliance audit trail: scenarios/compliance-audit-trail.md
      - Auditing third-party evals: scenarios/auditing-third-party-evals.md
  - Methodology: methodology.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vtensor/evalsig
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/evalsig/
    - icon: fontawesome/solid/globe
      link: https://www.melonai.in

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js