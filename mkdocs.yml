site_name: EVALSIG
site_description: Tell real LLM eval gains from infrastructure noise. Paired tests, clustered SE, MDE, sequential monitoring, and a CI release gate.
site_author: Vikram Dev
site_url: https://evalsig.dev
repo_url: https://github.com/vtensor/evalsig
repo_name: vtensor/evalsig
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Get started:
      - Installation: get-started/installation.md
      - Quickstart: get-started/quickstart.md
      - Your first comparison: get-started/first-comparison.md
      - Understanding the output: get-started/understanding-output.md
  - Concepts:
      - What evalsig solves: concepts/what-evalsig-solves.md
      - Paired vs unpaired: concepts/paired-vs-unpaired.md
      - Clustered standard errors: concepts/clustering.md
      - MDE and power: concepts/mde-and-power.md
      - Sequential testing: concepts/sequential-testing.md
      - Multiple comparisons: concepts/multiplicity.md
      - Effect sizes: concepts/effect-sizes.md
      - Glossary: concepts/glossary.md
  - Usage:
      - CLI reference: usage/cli.md
      - Python API: usage/python-api.md
      - Configuration: usage/configuration.md
      - Output formats: usage/output-formats.md
      - Integrations: usage/integrations.md
  - Modules:
      - evalsig.types: modules/types.md
      - evalsig.io: modules/io.md
      - evalsig.inference: modules/inference.md
      - evalsig.compare: modules/compare.md
      - evalsig.store: modules/store.md
      - evalsig.cli: modules/cli.md
      - evalsig.integrations: modules/integrations.md
      - evalsig.exceptions: modules/exceptions.md
  - Scenarios:
      - CI release gate: scenarios/ci-release-gate.md
      - A/B on RLHF checkpoints: scenarios/ab-on-rlhf-checkpoints.md
      - Flakiness detection: scenarios/flakiness-detection.md
      - Auditing third-party evals: scenarios/auditing-third-party-evals.md
      - Multi-task gates: scenarios/multi-task-gates.md
      - Sequential watch in CI: scenarios/sequential-watch.md
      - Compliance audit trail: scenarios/compliance-audit-trail.md
  - Methodology: methodology.md
  - Changelog: changelog.md
